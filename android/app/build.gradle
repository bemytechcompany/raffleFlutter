plugins {
    id "com.android.application"
    // KGP explícito a propósito: ver la nota de `android.builtInKotlin` en
    // gradle.properties.
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = 'raffle.com.raffle'
    // 36 lo exige share_plus. `targetSdk` se queda en 35 a propósito: subirlo
    // activa los cambios de comportamiento de Android 16 y eso hay que
    // probarlo en pantalla, no solo compilarlo.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId = "raffle.com.raffle"
        // Explícitos en vez de heredar de Flutter: Play exige un targetSdk
        // concreto y así el build no cambia al actualizar el SDK.
        minSdk = 24
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // Solo se declara la firma de release si existe `key.properties`; si no,
    // Gradle fallaba con un `storeFile` nulo.
    if (hasSigningConfig) {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Sin clave de firma se usa la de depuración, para que `flutter
            // build apk` siga funcionando en una máquina sin credenciales.
            signingConfig = hasSigningConfig
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
